<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Calculator</title>
	<link rel="icon" type="image/png" href="calc.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app-shell">
		<section class="calculator" aria-label="Calculator">
			<div class="calculator__header">
				<div class="eyebrow-row">
					<img src="calc.png" alt="Calculator logo" class="eyebrow__logo">
					<h3 class="eyebrow">Simple Calculator</h3>
				</div>
			</div>

			<div class="display" aria-live="polite">
				<div class="display__expression" id="expression">0</div>
				<div class="display__value" id="display">0</div>
			</div>

			<div class="keys" role="group" aria-label="Calculator keys">
				<button class="key key--ghost" data-action="clear">AC</button>
				<button class="key key--ghost" data-action="delete">DEL</button>
				<button class="key key--ghost" data-action="operator" data-value="%">%</button>
				<button class="key key--accent" data-action="operator" data-value="/">÷</button>

				<button class="key" data-action="number" data-value="7">7</button>
				<button class="key" data-action="number" data-value="8">8</button>
				<button class="key" data-action="number" data-value="9">9</button>
				<button class="key key--accent" data-action="operator" data-value="*">×</button>

				<button class="key" data-action="number" data-value="4">4</button>
				<button class="key" data-action="number" data-value="5">5</button>
				<button class="key" data-action="number" data-value="6">6</button>
				<button class="key key--accent" data-action="operator" data-value="-">−</button>

				<button class="key" data-action="number" data-value="1">1</button>
				<button class="key" data-action="number" data-value="2">2</button>
				<button class="key" data-action="number" data-value="3">3</button>
				<button class="key key--accent" data-action="operator" data-value="+">+</button>

				<button class="key key--wide" data-action="number" data-value="0">0</button>
				<button class="key" data-action="decimal">.</button>
				<button class="key key--equals" data-action="equals">=</button>
			</div>
		</section>
	</main>

	<script src="calculator.js" defer></script>
</body>
</html>
